name: Deploy to Nairahost (SFTP)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Upload via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 82.38.4.100
          username: dalacoee
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: "."
          target: "/home/dalacoee/domains/dalacoe.edu.ng/public_html"